name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build integration ZIP
        run: |
          mkdir -p dist
          zip -r "dist/carlo_gavazzi_em.zip" custom_components/carlo_gavazzi_em \
            -x "*/__pycache__/*" "*.pyc"
          sha256sum "dist/carlo_gavazzi_em.zip" > "dist/SHA256SUMS.txt"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/carlo_gavazzi_em.zip
            dist/SHA256SUMS.txt
